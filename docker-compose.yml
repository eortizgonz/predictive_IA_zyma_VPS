version: '3.8'

services:
  # Servicio de Ollama
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-service
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Tu App en Python (Predictive IA)
  predictive-ia-zyma:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: predictive-ia-zyma
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
      APP_ENV: "production"
      # Variables de conexión a Ollama dentro de la red Docker
      OLLAMA_BASE_URL: "http://ollama:11434"
      OLLAMA_HOST: "http://ollama:11434"
    volumes:
      - ./data:/app/data
      - ./knowledge_base:/app/knowledge_base
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  ollama_data:
    driver: local